name: Build

on:
  push:
    branches: [main]
    paths:
      - apps/test-producer/**

jobs:
  build-test-producer:
    name: Build test-producer image on VM
    runs-on: [self-hosted, dnavio-vm]
    steps:
      - uses: actions/checkout@v4

      - name: Build and import into containerd
        run: |
          docker build -t test-producer:latest apps/test-producer/
          docker save test-producer:latest | sudo ctr -n k8s.io images import -
          echo "Image imported:"
          sudo ctr -n k8s.io images ls | grep test-producer
