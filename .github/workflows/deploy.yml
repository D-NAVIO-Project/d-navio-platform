name: Deploy

on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]
    branches: [main]

defaults:
  run:
    shell: bash

jobs:
  deploy-dev:
    name: Deploy → dev
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, dnavio-vm]
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Set kubectl context
        run: kubectl config use-context kubernetes-admin@kubernetes

      - name: Adopt pre-existing resources into Helm
        run: |
          NS=dnavio-dev
          RELEASE=dnavio-platform
          for kind in pvc deployment service secret statefulset; do
            resources=$(kubectl get "$kind" -n "$NS" -o name 2>/dev/null || true)
            for res in $resources; do
              kubectl annotate "$res" -n "$NS" \
                "meta.helm.sh/release-name=$RELEASE" \
                "meta.helm.sh/release-namespace=$NS" \
                --overwrite 2>/dev/null || true
              kubectl label "$res" -n "$NS" \
                "app.kubernetes.io/managed-by=Helm" \
                --overwrite 2>/dev/null || true
            done
          done

      - name: Deploy to dnavio-dev
        env:
          KEYCLOAK_PASS: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          MINIO_PASS: ${{ secrets.MINIO_ROOT_PASSWORD }}
        run: |
          tmp=$(mktemp /tmp/secrets-XXXXXX.yaml)
          trap "rm -f $tmp" EXIT
          python3 -c "
          import os, json
          print('keycloak:')
          print('  adminPassword: ' + json.dumps(os.environ['KEYCLOAK_PASS']))
          print('minio:')
          print('  rootPassword: ' + json.dumps(os.environ['MINIO_PASS']))
          " > "$tmp"
          helm upgrade --install dnavio-platform ./helm/dnavio-platform \
            --namespace dnavio-dev \
            --create-namespace \
            -f helm/dnavio-platform/values-dev.yaml \
            -f "$tmp" \
            --wait \
            --timeout 10m \
            --atomic

  deploy-integration:
    name: Deploy → integration
    needs: deploy-dev
    if: ${{ needs.deploy-dev.result == 'success' }}
    runs-on: [self-hosted, dnavio-vm]
    environment: integration
    steps:
      - uses: actions/checkout@v4

      - name: Set kubectl context
        run: kubectl config use-context kubernetes-admin@kubernetes

      - name: Adopt pre-existing resources into Helm
        run: |
          NS=dnavio-integration
          RELEASE=dnavio-platform
          for kind in pvc deployment service secret statefulset; do
            resources=$(kubectl get "$kind" -n "$NS" -o name 2>/dev/null || true)
            for res in $resources; do
              kubectl annotate "$res" -n "$NS" \
                "meta.helm.sh/release-name=$RELEASE" \
                "meta.helm.sh/release-namespace=$NS" \
                --overwrite 2>/dev/null || true
              kubectl label "$res" -n "$NS" \
                "app.kubernetes.io/managed-by=Helm" \
                --overwrite 2>/dev/null || true
            done
          done

      - name: Deploy to dnavio-integration
        env:
          KEYCLOAK_PASS: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          MINIO_PASS: ${{ secrets.MINIO_ROOT_PASSWORD }}
        run: |
          tmp=$(mktemp /tmp/secrets-XXXXXX.yaml)
          trap "rm -f $tmp" EXIT
          python3 -c "
          import os, json
          print('keycloak:')
          print('  adminPassword: ' + json.dumps(os.environ['KEYCLOAK_PASS']))
          print('minio:')
          print('  rootPassword: ' + json.dumps(os.environ['MINIO_PASS']))
          " > "$tmp"
          helm upgrade --install dnavio-platform ./helm/dnavio-platform \
            --namespace dnavio-integration \
            --create-namespace \
            -f helm/dnavio-platform/values-integration.yaml \
            -f "$tmp" \
            --wait \
            --timeout 10m \
            --atomic

  deploy-pilot:
    name: Deploy → pilot
    needs: deploy-integration
    if: ${{ needs.deploy-integration.result == 'success' }}
    runs-on: [self-hosted, dnavio-vm]
    environment: pilot
    steps:
      - uses: actions/checkout@v4

      - name: Set kubectl context
        run: kubectl config use-context kubernetes-admin@kubernetes

      - name: Adopt pre-existing resources into Helm
        run: |
          NS=dnavio-pilot
          RELEASE=dnavio-platform
          for kind in pvc deployment service secret statefulset; do
            resources=$(kubectl get "$kind" -n "$NS" -o name 2>/dev/null || true)
            for res in $resources; do
              kubectl annotate "$res" -n "$NS" \
                "meta.helm.sh/release-name=$RELEASE" \
                "meta.helm.sh/release-namespace=$NS" \
                --overwrite 2>/dev/null || true
              kubectl label "$res" -n "$NS" \
                "app.kubernetes.io/managed-by=Helm" \
                --overwrite 2>/dev/null || true
            done
          done

      - name: Deploy to dnavio-pilot
        env:
          KEYCLOAK_PASS: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          MINIO_PASS: ${{ secrets.MINIO_ROOT_PASSWORD }}
        run: |
          tmp=$(mktemp /tmp/secrets-XXXXXX.yaml)
          trap "rm -f $tmp" EXIT
          python3 -c "
          import os, json
          print('keycloak:')
          print('  adminPassword: ' + json.dumps(os.environ['KEYCLOAK_PASS']))
          print('minio:')
          print('  rootPassword: ' + json.dumps(os.environ['MINIO_PASS']))
          " > "$tmp"
          helm upgrade --install dnavio-platform ./helm/dnavio-platform \
            --namespace dnavio-pilot \
            --create-namespace \
            -f helm/dnavio-platform/values-pilot.yaml \
            -f "$tmp" \
            --wait \
            --timeout 10m \
            --atomic
