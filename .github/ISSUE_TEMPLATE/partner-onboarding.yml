name: Partner onboarding request
description: Request identities, topics and resources for a partner's components on the D-NAVIO platform.
title: "[Onboarding] <partner>"
labels: ["onboarding"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in this form to connect your components to the D-NAVIO platform. The NTUA team reviews the
        request, creates your identities, topics and access rules, and replies here when they are ready.

        **This repository is public, so this issue is visible to anyone.** Do not include passwords,
        tokens, internal hostnames, IP addresses or personal data. Credentials are handed over
        separately once the request is approved.

  - type: input
    id: partner
    attributes:
      label: Partner id
      description: Short identifier, used as the prefix of all your resources. Lowercase letters, digits and hyphens.
      placeholder: t42
    validations:
      required: true

  - type: input
    id: organisation
    attributes:
      label: Organisation
      placeholder: TUBS
    validations:
      required: true

  - type: input
    id: contact
    attributes:
      label: Technical contact
      description: GitHub handle of the person we coordinate with.
      placeholder: "@username"
    validations:
      required: true

  - type: dropdown
    id: hosting
    attributes:
      label: Where do your components run?
      options:
        - In-cluster — deployed on the D-NAVIO platform
        - External — hosted by us, connecting over the network
    validations:
      required: true

  - type: textarea
    id: components
    attributes:
      label: Components
      description: One line per service — name, purpose, and expected memory. In-cluster only.
      placeholder: |
        ingest-api — controlled ingress for telemetry — 64Mi
        stream-processor — normalisation and persistence — 128Mi

  - type: textarea
    id: identities
    attributes:
      label: Identities
      description: One Keycloak service account per role that needs broker access, and what it is used for.
      placeholder: |
        svc-dml — ingest-api, stream-processor
        svc-frs — frs-api, frs-derive, hydra-packager
    validations:
      required: true

  - type: textarea
    id: produces
    attributes:
      label: Topics you produce
      description: |
        Topics your components write to. Naming convention: dnavio.<component>.<entity>.<qualifier>.
        Give the identity that writes, the expected rate and how long messages must be kept.
      placeholder: |
        dnavio.frs.hydra.probability-update — svc-frs — ~1 msg/30 min — 30 days

  - type: textarea
    id: consumes
    attributes:
      label: Topics you consume
      description: Topics your components read from, and the identity that reads them.
      placeholder: |
        dnavio.dml.telemetry.normalized — svc-frs

  - type: checkboxes
    id: datastores
    attributes:
      label: Datastores needed
      options:
        - label: PostgreSQL
        - label: MongoDB
        - label: MinIO (object storage)

  - type: input
    id: memory
    attributes:
      label: Total memory budget
      description: Sum of the memory of all your components (in-cluster only).
      placeholder: 512Mi

  - type: input
    id: contract
    attributes:
      label: Message contract
      description: Link to the AsyncAPI description of the topics you produce, if available.
      placeholder: https://github.com/D-NAVIO-Project/<repo>/blob/main/contracts/asyncapi.yaml

  - type: input
    id: external-credentials
    attributes:
      label: Third-party credentials
      description: |
        Names only (never values) of any external credentials your components need, e.g. "METIS client id
        and secret". We create a Secret for them and agree a private channel for the values.

  - type: textarea
    id: notes
    attributes:
      label: Anything else

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: This request contains no passwords, tokens, internal hostnames, IP addresses or personal data.
          required: true
