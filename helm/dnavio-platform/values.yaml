# Default values for dnavio-platform.
# Override per environment with values-<env>.yaml.

# TLS material for Keycloak HTTPS and the Kafka EXTERNAL listener. The Secret
# must exist in the target namespace before deploying — see
# scripts/tls/generate-dev-cert.sh (self-signed dev CA, one per namespace).
tls:
  secretName: dnavio-tls

kafka:
  image:
    repository: confluentinc/cp-kafka
    tag: "7.8.3"
  # KRaft single-node config — do not change clusterId after first deploy.
  clusterId: "1L6g7nGhU-eAKfL--X25wo"
  nodeId: 1
  storage:
    size: 5Gi
  # External SASL/OAUTHBEARER listener. Partners (e.g. Maggioli) connect here
  # with a Keycloak token. advertisedHost:nodePort must be reachable by them.
  external:
    advertisedHost: "147.102.6.143"
    nodePort: 30094
  # Topic definitions — consumed by the post-install Job and by dependent services.
  # Add new topics here; the Job is idempotent (--if-not-exists).
  # Optional `config` is applied with kafka-configs --alter on every deploy.
  # NOTE: values-pilot.yaml replaces this whole list (Helm does not merge
  # lists) — add new topics there too.
  #
  # Retention budget: telemetry is high-volume (a full T4.2 pilot replay is
  # ~7.5M records), so the telemetry topics are size-capped per partition to
  # keep the broker volume from filling. The durable copy of telemetry is the
  # DML's Postgres/Mongo, not Kafka. retention.bytes is enforced per closed
  # segment, hence the smaller segment.bytes.
  topics:
    - name: dnavio.dml.telemetry.raw
      partitions: 1
      replicationFactor: 1
      config: &telemetryRetention
        retention.ms: 604800000       # 7 days
        retention.bytes: 536870912    # 512 MiB per partition
        segment.bytes: 67108864       # 64 MiB
    - name: dnavio.dml.telemetry.normalized
      partitions: 1
      replicationFactor: 1
      config: *telemetryRetention
    - name: dnavio.frs.failures.reported
      partitions: 1
      replicationFactor: 1
      config: &retainForever
        retention.ms: -1              # failure records are kept indefinitely (low volume)
    - name: dnavio.dml.deadletter
      partitions: 1
      replicationFactor: 1
      config: &deadletterRetention
        retention.ms: 2592000000      # 30 days (the DML also archives DLQ records in Mongo)
        retention.bytes: 134217728    # 128 MiB per partition
        segment.bytes: 67108864
    # FRS -> HYDRA root-node probability packages (T4.2 hydra-packager).
    - name: dnavio.frs.hydra.probability-update
      partitions: 1
      replicationFactor: 1
      config: &thirtyDays
        retention.ms: 2592000000
    # Inbound to FRS (T4.2 frs-api consumes). No producer yet — pre-created
    # so consumers subscribe cleanly and the topics get platform settings
    # rather than broker auto-create defaults.
    - name: dnavio.hydra.riskscores
      partitions: 1
      replicationFactor: 1
    - name: dnavio.frs.incidents.cyber
      partitions: 1
      replicationFactor: 1
      config: *retainForever
    # Mock restricted topic: demonstrates enforced ACLs. Only the admin
    # identity may write (see kafka.acls below).
    - name: dnavio.ops.admin-audit
      partitions: 1
      replicationFactor: 1
  # Topic ACLs enforced by StandardAuthorizer, created by the kafka-acls-init
  # Job. Topics NOT listed here remain open to any authenticated client
  # (allow.everyone.if.no.acl.found=true). For each entry: any authenticated
  # client may read; only the listed writer principals may produce.
  acls:
    - topic: dnavio.ops.admin-audit
      writers:
        - svc-admin

keycloak:
  image:
    repository: quay.io/keycloak/keycloak
    tag: "26.1"
  # Platform realm. Kafka derives its JWKS endpoint and expected issuer from this.
  realm: d-navio
  adminUsername: admin
  # Set via --set keycloak.adminPassword=... in CI. Never commit a real value here.
  adminPassword: ""
  # Pinned frontend URL. Keycloak stamps this as the `iss` claim on EVERY token,
  # regardless of how it was requested (in-cluster, port-forward, or partner).
  # Kafka validates tokens against "<hostname>/realms/<realm>" — the SAME value,
  # so issuer + expected-issuer never drift. Must be reachable by external
  # partners; HTTPS so partner credentials are not sent in cleartext.
  hostname: "https://147.102.6.143:30443"
  service:
    type: NodePort
    nodePort: 30080
    # HTTPS port for external/partner token retrieval (client secrets are
    # POSTed here, so this is the more sensitive of the two ports).
    httpsNodePort: 30443
  # Persist the H2 database so the realm + clients survive pod restarts.
  storage:
    size: 1Gi
  # Identities and realm roles are provisioned by the bootstrap Job following
  # docs/operations/rbac-access-model.md: per-component service accounts
  # (svc-dml, svc-frs, svc-dynamo, svc-admin) and human realm roles (operator,
  # analyst, integrator, admin). Kafka ACLs are enforced only for topics listed
  # in kafka.acls; all other topics accept any authenticated client.
  #
  # Service-account clients whose secret the PLATFORM manages: generated on
  # first install, kept stable across upgrades, stored in the
  # dnavio-component-credentials Secret (<clientId>-client-id /
  # <clientId>-client-secret) and reconciled into Keycloak by the bootstrap Job.
  # In-cluster components (T4.2 DML/FRS) mount it instead of an operator
  # fetching secrets by hand. Set `secret` to override (e.g. from CI).
  # Clients not listed here keep a Keycloak-generated secret.
  componentClients:
    - clientId: svc-dml   # T4.2 ingest-api, stream-processor
      secret: ""
    - clientId: svc-frs   # T4.2 frs-api, frs-derive, hydra-packager
      secret: ""
  clients:
    # Confidential client used by D-NAVIO services and the Kafka scripts/Job to
    # obtain tokens (client credentials grant). The realm-bootstrap Job reconciles
    # this client's secret to the value below on every deploy. Retained as the
    # platform operations/tooling identity (see rbac-access-model.md).
    # Set via --set keycloak.clients.dnavioApi.secret=... in CI. Never commit.
    dnavioApi:
      clientId: dnavio-api
      secret: ""

minio:
  image:
    repository: minio/minio
    tag: "RELEASE.2024-11-07T00-52-20Z"
  rootUser: admin
  # Set via --set minio.rootPassword=... in CI. Never commit a real value here.
  rootPassword: ""
  storage:
    size: 10Gi

# --- Shared datastores (D4.1 §6.1.2: relational + document store) ---
# Hosted by the platform so components integrate against one managed pair of
# stores. The initial schema is the T4.2 (DML/FRS) schema, synced into
# files/datastores/ — see the README there. Init scripts run only on an EMPTY
# volume; later schema changes need a migration.
#
# Credentials are generated on first install and kept stable across upgrades
# in the dnavio-datastores Secret (helm.sh/resource-policy: keep). Components
# read ready-made connection strings from it: postgres-dsn, mongo-uri.
# Set the password fields only to override (e.g. from CI). Never commit values.
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  username: dnavio
  database: dnavio
  password: ""
  storage:
    size: 10Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "768Mi"

mongo:
  enabled: true
  image:
    repository: mongo
    tag: "7.0"
  rootUsername: admin
  rootPassword: ""
  # Least-privilege application user (readWrite on `database` only) that
  # components connect as — created by files/datastores/mongo/00-app-user.js.
  appUsername: dnavio
  appPassword: ""
  database: dnavio
  # Keep well under the memory limit; WiredTiger would otherwise size its
  # cache from host RAM.
  wiredTigerCacheSizeGB: "0.25"
  storage:
    size: 5Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "768Mi"

testProducer:
  enabled: false
  image: test-producer:latest
  imagePullPolicy: Never
  topic: dnavio.dml.telemetry.raw
