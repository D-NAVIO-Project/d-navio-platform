# Pilot / demo environment overrides.
kafka:
  storage:
    size: 10Gi
  topics:
    - name: dnavio.telemetry.raw
      partitions: 3
      replicationFactor: 1
    - name: dnavio.telemetry.processed
      partitions: 3
      replicationFactor: 1
    - name: dnavio.alerts
      partitions: 2
      replicationFactor: 1
    - name: dnavio.failures
      partitions: 2
      replicationFactor: 1
    - name: dnavio.risk
      partitions: 2
      replicationFactor: 1

minio:
  storage:
    size: 20Gi
