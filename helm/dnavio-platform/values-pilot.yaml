# Pilot / demo environment overrides.
# Distinct NodePorts from dev/integration — all three share the same VM node.
keycloak:
  hostname: "https://147.102.6.143:32443"
  service:
    nodePort: 32080
    httpsNodePort: 32443

kafka:
  external:
    advertisedHost: "147.102.6.143"
    nodePort: 32094
  storage:
    size: 10Gi
  topics:
    - name: dnavio.dml.telemetry.raw
      partitions: 3
      replicationFactor: 1
    - name: dnavio.dml.telemetry.normalized
      partitions: 3
      replicationFactor: 1
    - name: dnavio.frs.failures.reported
      partitions: 2
      replicationFactor: 1
    - name: dnavio.dml.deadletter
      partitions: 2
      replicationFactor: 1

minio:
  storage:
    size: 20Gi
