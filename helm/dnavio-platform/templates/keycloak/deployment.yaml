apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    {{- include "dnavio-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "dnavio-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: keycloak
  strategy:
    # RWO volume — old pod must release it before the new one mounts.
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "dnavio-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: keycloak
      annotations:
        # kubectl exec/logs without -c keep addressing Keycloak, not the gateway.
        kubectl.kubernetes.io/default-container: keycloak
        # Restart the pod when the gateway's rules change.
        checksum/gateway: {{ include (print $.Template.BasePath "/keycloak/gateway-configmap.yaml") . | sha256sum }}
    spec:
      restartPolicy: Always
      containers:
        # Gateway for traffic from outside the cluster (Service
        # keycloak-external): limits the admin console to allowed source ranges.
        - name: gateway
          image: "{{ .Values.keycloak.gateway.image.repository }}:{{ .Values.keycloak.gateway.image.tag }}"
          ports:
            - name: gateway
              containerPort: 9443
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: gateway
            periodSeconds: 10
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "48Mi"
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: gateway-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: dnavio-tls
              mountPath: /etc/dnavio-tls
              readOnly: true
        - name: keycloak
          image: "{{ .Values.keycloak.image.repository }}:{{ .Values.keycloak.image.tag }}"
          args:
            - start-dev
            - --http-enabled=true
            - --https-certificate-file=/etc/dnavio-tls/tls.crt
            - --https-certificate-key-file=/etc/dnavio-tls/tls.key
            - --hostname-strict=false
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
          env:
            # Pin the frontend URL so every issued token carries a stable `iss`
            # claim. The pod still listens on 8080; this only sets advertised URLs.
            - name: KC_HOSTNAME
              value: {{ .Values.keycloak.hostname | quote }}
            # Allow in-cluster clients to reach the token endpoint via keycloak:8080
            # while still stamping iss = KC_HOSTNAME on the tokens they receive.
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-credentials
                  key: admin-username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-credentials
                  key: admin-password
            - name: JAVA_OPTS_APPEND
              value: "-Xms128m -Xmx384m -XX:MaxMetaspaceSize=192m"
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
          volumeMounts:
            # Persist the H2 database so the realm + clients survive restarts.
            - name: keycloak-data
              mountPath: /opt/keycloak/data
            # Server cert/key for HTTPS (external/partner token retrieval).
            - name: dnavio-tls
              mountPath: /etc/dnavio-tls
              readOnly: true
      volumes:
        - name: gateway-config
          configMap:
            name: keycloak-gateway
        - name: keycloak-data
          persistentVolumeClaim:
            claimName: keycloak-data
        - name: dnavio-tls
          secret:
            secretName: {{ .Values.tls.secretName }}
