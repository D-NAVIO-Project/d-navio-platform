{{- if .Values.keycloak.componentClients }}
{{- $name := "dnavio-component-credentials" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "dnavio-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
  annotations:
    # Components hold these secrets; regenerating them on reinstall would
    # silently break every consumer.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # One pair per managed service-account client. The realm-bootstrap Job
  # reconciles each Keycloak client's secret to the value stored here, and
  # component Deployments read their credentials from this Secret, e.g.
  # svc-dml-client-id / svc-dml-client-secret.
  {{- range .Values.keycloak.componentClients }}
  {{ .clientId }}-client-id: {{ .clientId | quote }}
  {{ .clientId }}-client-secret: {{ include "dnavio-platform.stableSecret" (list $ $name (printf "%s-client-secret" .clientId) .secret) | quote }}
  {{- end }}
{{- end }}
