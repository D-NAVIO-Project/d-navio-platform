apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    {{- include "dnavio-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  # In-cluster access only (keycloak:8080 for components, Kafka and the hook
  # Jobs). Access from outside the cluster goes through keycloak-external.
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: https
      port: 8443
      targetPort: 8443
      protocol: TCP
  selector:
    {{- include "dnavio-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
