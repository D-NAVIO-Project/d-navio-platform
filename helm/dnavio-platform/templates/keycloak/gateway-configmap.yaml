apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-gateway
  labels:
    {{- include "dnavio-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
data:
  # nginx in front of Keycloak for traffic from outside the cluster.
  #   Anyone:               the platform realm (tokens, login pages) and the
  #                         static files those pages load.
  #   Allowed ranges only:  everything else — the admin console, the master
  #                         realm, any other realm.
  default.conf: |
    server {
      listen 9443 ssl;
      server_tokens off;

      ssl_certificate     /etc/dnavio-tls/tls.crt;
      ssl_certificate_key /etc/dnavio-tls/tls.key;

      # Keycloak runs in the same pod, with the same certificate.
      proxy_ssl_verify off;
      proxy_set_header Host $http_host;
      proxy_buffer_size 16k;
      proxy_buffers 8 16k;

      location /realms/{{ .Values.keycloak.realm }}/ {
        proxy_pass https://127.0.0.1:8443;
      }
      location /resources/ {
        proxy_pass https://127.0.0.1:8443;
      }
      location / {
        {{- range .Values.keycloak.gateway.adminAllowedCIDRs }}
        allow {{ . }};
        {{- end }}
        deny all;
        proxy_pass https://127.0.0.1:8443;
      }
    }
