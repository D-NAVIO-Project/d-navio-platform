apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-realm-bootstrap
  labels:
    {{- include "dnavio-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-bootstrap
  annotations:
    # Runs after every install and upgrade; idempotent (creates-or-reconciles).
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        {{- include "dnavio-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: keycloak-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: "{{ .Values.keycloak.image.repository }}:{{ .Values.keycloak.image.tag }}"
          env:
            - name: KC_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-credentials
                  key: admin-username
            - name: KC_ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: keycloak-credentials
                  key: admin-password
            - name: DNAVIO_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-secrets
                  key: dnavio-api-secret
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              KCADM=/opt/keycloak/bin/kcadm.sh
              SERVER=http://keycloak:8080
              REALM={{ .Values.keycloak.realm | quote }}
              CLIENT_ID={{ .Values.keycloak.clients.dnavioApi.clientId | quote }}

              # Wait for Keycloak to be reachable by attempting an admin login.
              echo "Waiting for Keycloak admin API..."
              until "$KCADM" config credentials --server "$SERVER" \
                    --realm master --user "$KC_ADMIN_USER" --password "$KC_ADMIN_PASS" \
                    >/dev/null 2>&1; do
                echo "  not ready yet, retrying in 5s..."
                sleep 5
              done
              echo "Authenticated to Keycloak."

              # Ensure the platform realm exists.
              if "$KCADM" get "realms/${REALM}" >/dev/null 2>&1; then
                echo "Realm '${REALM}' already exists."
              else
                echo "Creating realm '${REALM}'."
                "$KCADM" create realms -s realm="${REALM}" -s enabled=true
              fi

              # Ensure the confidential service-account client exists with a
              # deterministic secret (create, or reconcile if already present).
              CID=$("$KCADM" get clients -r "${REALM}" -q clientId="${CLIENT_ID}" \
                    --fields id --format csv --noquotes 2>/dev/null | tail -n1 | tr -d '\r')
              if [ -z "${CID}" ]; then
                echo "Creating client '${CLIENT_ID}'."
                "$KCADM" create clients -r "${REALM}" \
                  -s clientId="${CLIENT_ID}" \
                  -s enabled=true \
                  -s protocol=openid-connect \
                  -s publicClient=false \
                  -s standardFlowEnabled=false \
                  -s directAccessGrantsEnabled=false \
                  -s serviceAccountsEnabled=true \
                  -s secret="${DNAVIO_API_SECRET}"
              else
                echo "Reconciling client '${CLIENT_ID}' (${CID})."
                "$KCADM" update "clients/${CID}" -r "${REALM}" \
                  -s enabled=true \
                  -s protocol=openid-connect \
                  -s publicClient=false \
                  -s standardFlowEnabled=false \
                  -s directAccessGrantsEnabled=false \
                  -s serviceAccountsEnabled=true \
                  -s secret="${DNAVIO_API_SECRET}"
              fi

              # --- RBAC identities (feat/rbac-access-model) ---
              # Component service accounts. By default created without a fixed
              # secret — Keycloak generates one, retrieved when the component
              # onboards. Clients listed in keycloak.componentClients instead get
              # the secret from the dnavio-component-credentials Secret (optional
              # 2nd argument), so in-cluster components can mount it directly.
              ensure_service_client() {
                local cid="$1" secret="${2:-}" existing
                local -a secret_arg=()
                if [ -n "${secret}" ]; then
                  secret_arg=(-s "secret=${secret}")
                fi
                # Who owns the identity, shown in the admin console.
                if [ -n "${CLIENT_DESC[$cid]:-}" ]; then
                  secret_arg+=(-s "description=${CLIENT_DESC[$cid]}")
                fi
                existing=$("$KCADM" get clients -r "${REALM}" -q clientId="${cid}" \
                  --fields id --format csv --noquotes 2>/dev/null | tail -n1 | tr -d '\r')
                if [ -z "${existing}" ]; then
                  echo "Creating service-account client '${cid}'."
                  "$KCADM" create clients -r "${REALM}" \
                    -s clientId="${cid}" \
                    -s enabled=true \
                    -s protocol=openid-connect \
                    -s publicClient=false \
                    -s standardFlowEnabled=false \
                    -s directAccessGrantsEnabled=false \
                    -s serviceAccountsEnabled=true \
                    "${secret_arg[@]}"
                else
                  echo "Reconciling service-account client '${cid}' (${existing})."
                  "$KCADM" update "clients/${existing}" -r "${REALM}" \
                    -s enabled=true \
                    -s protocol=openid-connect \
                    -s publicClient=false \
                    -s standardFlowEnabled=false \
                    -s directAccessGrantsEnabled=false \
                    -s serviceAccountsEnabled=true \
                    "${secret_arg[@]}"
                fi
              }

              ensure_realm_role() {
                local role="$1" description="${2:-}"
                if "$KCADM" get "roles/${role}" -r "${REALM}" >/dev/null 2>&1; then
                  echo "Reconciling realm role '${role}'."
                  "$KCADM" update "roles/${role}" -r "${REALM}" -s "description=${description}"
                else
                  echo "Creating realm role '${role}'."
                  "$KCADM" create roles -r "${REALM}" -s name="${role}" -s "description=${description}"
                fi
              }

              # Print the id of the row whose second column equals $1, from
              # "id,name" CSV on stdin (the Keycloak image has no awk).
              lookup() {
                local id name
                while IFS=, read -r id name; do
                  name="${name%$'\r'}"
                  if [ "${name}" = "$1" ]; then echo "${id}"; return 0; fi
                done
                return 0
              }

              # The RBAC baseline identities, plus every client in
              # keycloak.componentClients (so a new component identity is
              # created in Keycloak, not only given a stored secret).
              CREDS_DIR=/etc/dnavio-component-credentials
              CLIENTS="svc-dml svc-frs svc-dynamo svc-admin"
              declare -A CLIENT_DESC=(
                [svc-dynamo]="DYNAMO (MAG)"
                [svc-admin]="Platform administration (NTUA)"
              )
              {{- range .Values.keycloak.componentClients }}
              case " ${CLIENTS} " in *" {{ .clientId }} "*) ;; *) CLIENTS="${CLIENTS} {{ .clientId }}" ;; esac
              {{- if .description }}
              CLIENT_DESC[{{ .clientId }}]={{ .description | quote }}
              {{- end }}
              {{- end }}
              for c in ${CLIENTS}; do
                if [ -f "${CREDS_DIR}/${c}-client-secret" ]; then
                  ensure_service_client "$c" "$(cat "${CREDS_DIR}/${c}-client-secret")"
                else
                  ensure_service_client "$c"
                fi
              done

              # Roles for people (FR-AUTH-02), from keycloak.realmRoles.
              {{- range .Values.keycloak.realmRoles }}
              ensure_realm_role {{ .name | quote }} {{ .description | default "" | quote }}
              {{- end }}

              # svc-admin is the platform-administration machine identity: it
              # holds the 'admin' realm role (so its tokens carry it in
              # realm_access.roles) and is the only principal allowed to write
              # to ACL-restricted admin topics (see kafka.acls in values.yaml).
              # add-roles is idempotent.
              "$KCADM" add-roles -r "${REALM}" \
                --uusername "service-account-svc-admin" \
                --rolename admin

              # --- Organisations (keycloak.organizations) ---
              # One per partner or pilot company. People are added to them by
              # invitation from the admin console, never from this repository.
              # Each organisation carries the vessels its members may see
              # ("*" = all) and its type; with the 'organization' client scope
              # these reach the token, for user interfaces to enforce.
              ensure_organization() {
                local alias="$1" body id
                body="$(cat)"
                id=$("$KCADM" get organizations -r "${REALM}" -q max=1000 \
                      --fields id,alias --format csv --noquotes 2>/dev/null | lookup "${alias}")
                if [ -z "${id}" ]; then
                  echo "Creating organisation '${alias}'."
                  printf '%s' "${body}" | "$KCADM" create organizations -r "${REALM}" -f -
                else
                  echo "Reconciling organisation '${alias}' (${id})."
                  printf '%s' "${body}" | "$KCADM" update "organizations/${id}" -r "${REALM}" -f -
                fi
              }

              setup_organizations() {
                "$KCADM" update "realms/${REALM}" -s organizationsEnabled=true || return 1
                {{- range .Values.keycloak.organizations }}
                {{- $domains := list }}
                {{- /* Keycloak requires a domain; without a real one, use a
                       reserved name that no email address can match. */}}
                {{- range (.domains | default (list (printf "%s.d-navio.invalid" .alias))) }}
                {{- $domains = append $domains (dict "name" . "verified" false) }}
                {{- end }}
                {{- $attrs := dict "type" (list (.type | default "partner")) "vessels" (.vessels | default (list)) }}
                {{- $org := dict "name" .name "alias" .alias "enabled" true "description" (.description | default "") "domains" $domains "attributes" $attrs }}
                ensure_organization {{ .alias | quote }} <<'JSON' || return 1
              {{ $org | toJson }}
              JSON
                {{- end }}

                # Put the organisation's id and attributes (vessels, type) into
                # tokens that carry the 'organization' scope.
                local scope mapper
                scope=$("$KCADM" get client-scopes -r "${REALM}" --fields id,name \
                          --format csv --noquotes 2>/dev/null | lookup organization)
                [ -n "${scope}" ] || { echo "client scope 'organization' not found"; return 1; }
                mapper=$("$KCADM" get "client-scopes/${scope}/protocol-mappers/models" -r "${REALM}" \
                          --fields id,name --format csv --noquotes 2>/dev/null | lookup organization)
                [ -n "${mapper}" ] || { echo "mapper 'organization' not found"; return 1; }
                "$KCADM" update "client-scopes/${scope}/protocol-mappers/models/${mapper}" -r "${REALM}" \
                  -s 'config."addOrganizationAttributes"=true' \
                  -s 'config."addOrganizationId"=true' || return 1
              }

              {{- if .Values.keycloak.organizations }}
              # A failure here is reported but does not fail the deployment:
              # components and Kafka do not depend on organisations.
              if setup_organizations; then
                echo "Organisations reconciled."
              else
                echo "WARNING: organisation setup did not complete — see the messages above."
              fi
              {{- end }}

              echo "Keycloak realm bootstrap complete."
          {{- if .Values.keycloak.componentClients }}
          volumeMounts:
            - name: component-credentials
              mountPath: /etc/dnavio-component-credentials
              readOnly: true
      volumes:
        - name: component-credentials
          secret:
            secretName: dnavio-component-credentials
          {{- end }}
