apiVersion: v1
kind: Secret
metadata:
  name: keycloak-client-secrets
  labels:
    {{- include "dnavio-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
type: Opaque
stringData:
  # Consumed by the realm-bootstrap Job (to set the client secret in Keycloak)
  # and by the Kafka topics-init Job / scripts (to authenticate to the broker).
  dnavio-api-secret: {{ .Values.keycloak.clients.dnavioApi.secret | quote }}
