{{- if or .Values.postgres.enabled .Values.mongo.enabled }}
{{- $name := "dnavio-datastores" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "dnavio-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: datastores
  annotations:
    # The databases read these credentials only when their volume is first
    # initialised, so the Secret must outlive a `helm uninstall` that keeps the
    # PVCs. A later install adopts it again (it keeps the release annotations).
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # Consumed by the datastore Deployments and by component services
  # (e.g. T4.2: DNAVIO_POSTGRES_DSN <- postgres-dsn, DNAVIO_MONGO_URI <- mongo-uri).
  {{- if .Values.postgres.enabled }}
  {{- $pgPass := include "dnavio-platform.stableSecret" (list $ $name "postgres-password" .Values.postgres.password) }}
  postgres-user: {{ .Values.postgres.username | quote }}
  postgres-password: {{ $pgPass | quote }}
  postgres-database: {{ .Values.postgres.database | quote }}
  postgres-dsn: {{ printf "postgres://%s:%s@postgres:5432/%s?sslmode=disable" .Values.postgres.username ($pgPass | urlquery) .Values.postgres.database | quote }}
  {{- end }}
  {{- if .Values.mongo.enabled }}
  {{- $rootPass := include "dnavio-platform.stableSecret" (list $ $name "mongo-root-password" .Values.mongo.rootPassword) }}
  {{- $appPass := include "dnavio-platform.stableSecret" (list $ $name "mongo-app-password" .Values.mongo.appPassword) }}
  mongo-root-user: {{ .Values.mongo.rootUsername | quote }}
  mongo-root-password: {{ $rootPass | quote }}
  mongo-app-user: {{ .Values.mongo.appUsername | quote }}
  mongo-app-password: {{ $appPass | quote }}
  mongo-database: {{ .Values.mongo.database | quote }}
  mongo-uri: {{ printf "mongodb://%s:%s@mongo:27017/%s?authSource=%s" .Values.mongo.appUsername ($appPass | urlquery) .Values.mongo.database .Values.mongo.database | quote }}
  {{- end }}
{{- end }}
