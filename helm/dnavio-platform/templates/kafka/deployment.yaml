apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels:
    {{- include "dnavio-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "dnavio-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: kafka
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "dnavio-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: kafka
    spec:
      hostname: kafka
      enableServiceLinks: false
      restartPolicy: Always
      initContainers:
        # Kafka's PEM keystore is a single file with the cert chain + private key.
        # The dnavio-tls Secret exposes them as separate tls.crt/tls.key, so
        # concatenate them into a shared emptyDir the broker reads at startup.
        - name: assemble-keystore
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          command:
            - /bin/bash
            - -c
            - cat /etc/dnavio-tls/tls.crt /etc/dnavio-tls/tls.key > /etc/kafka-tls/keystore.pem
          volumeMounts:
            - name: dnavio-tls
              mountPath: /etc/dnavio-tls
              readOnly: true
            - name: kafka-tls
              mountPath: /etc/kafka-tls
        # Block until the d-navio realm's JWKS endpoint exists — on a fresh
        # install the realm is created by the post-install bootstrap Job, and
        # Kafka crashes at startup if it cannot fetch validation keys.
        - name: wait-for-keycloak-realm
          image: curlimages/curl:8.11.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              JWKS="http://keycloak:8080/realms/{{ .Values.keycloak.realm }}/protocol/openid-connect/certs"
              echo "Waiting for Keycloak realm '{{ .Values.keycloak.realm }}' JWKS endpoint..."
              until curl -sf "$JWKS" > /dev/null; do
                echo "  not ready, retrying in 10s..."
                sleep 10
              done
              echo "JWKS endpoint is available — starting Kafka."
      containers:
        - name: kafka
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          ports:
            - name: internal
              containerPort: 9092
              protocol: TCP
            - name: external
              containerPort: 9094
              protocol: TCP
          env:
            - name: KAFKA_KRAFT_MODE
              value: "true"
            - name: CLUSTER_ID
              value: {{ .Values.kafka.clusterId | quote }}
            - name: KAFKA_NODE_ID
              value: {{ .Values.kafka.nodeId | quote }}
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            # Four listeners:
            #   BROKER     loopback PLAINTEXT — inter-broker only (broker-to-self)
            #   INTERNAL   SASL/OAUTHBEARER   — in-cluster D-NAVIO services
            #   EXTERNAL   SASL/OAUTHBEARER   — partners via NodePort
            #   CONTROLLER loopback PLAINTEXT — KRaft quorum, single node
            - name: KAFKA_LISTENERS
              value: "BROKER://127.0.0.1:9091,INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "BROKER://127.0.0.1:9091,INTERNAL://kafka:9092,EXTERNAL://{{ .Values.kafka.external.advertisedHost }}:{{ .Values.kafka.external.nodePort }}"
            # EXTERNAL is SASL_SSL — partner tokens travel over TLS. INTERNAL stays
            # SASL_PLAINTEXT (trusted in-cluster network); loopback stays PLAINTEXT.
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "BROKER:PLAINTEXT,INTERNAL:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:SASL_SSL"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "BROKER"
            # OAUTHBEARER (OIDC): validate every client token against Keycloak.
            # JWKS is fetched in-cluster; the issuer must match the pinned hostname.
            - name: KAFKA_SASL_ENABLED_MECHANISMS
              value: "OAUTHBEARER"
            - name: KAFKA_SASL_OAUTHBEARER_JWKS_ENDPOINT_URL
              value: "http://keycloak:8080/realms/{{ .Values.keycloak.realm }}/protocol/openid-connect/certs"
            - name: KAFKA_SASL_OAUTHBEARER_EXPECTED_ISSUER
              value: "{{ .Values.keycloak.hostname }}/realms/{{ .Values.keycloak.realm }}"
            # Keycloak stamps aud=account by default; jose4j requires the expected
            # audience to be declared when an aud claim is present. (A dedicated
            # "kafka" audience mapper is a future authorization hardening step.)
            - name: KAFKA_SASL_OAUTHBEARER_EXPECTED_AUDIENCE
              value: "account"
            - name: KAFKA_LISTENER_NAME_INTERNAL_OAUTHBEARER_SASL_SERVER_CALLBACK_HANDLER_CLASS
              value: "org.apache.kafka.common.security.oauthbearer.secured.OAuthBearerValidatorCallbackHandler"
            - name: KAFKA_LISTENER_NAME_EXTERNAL_OAUTHBEARER_SASL_SERVER_CALLBACK_HANDLER_CLASS
              value: "org.apache.kafka.common.security.oauthbearer.secured.OAuthBearerValidatorCallbackHandler"
            - name: KAFKA_LISTENER_NAME_INTERNAL_OAUTHBEARER_SASL_JAAS_CONFIG
              value: "org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required ;"
            - name: KAFKA_LISTENER_NAME_EXTERNAL_OAUTHBEARER_SASL_JAAS_CONFIG
              value: "org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required ;"
            # --- Authorization (ACLs) ---
            # StandardAuthorizer with incremental rollout: topics WITHOUT ACLs
            # remain open to any authenticated client; topics WITH ACLs are
            # deny-by-default. ACLs are created by the kafka-acls-init Job from
            # .Values.kafka.acls.
            - name: KAFKA_AUTHORIZER_CLASS_NAME
              value: "org.apache.kafka.metadata.authorizer.StandardAuthorizer"
            - name: KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND
              value: "true"
            # Loopback listeners (BROKER inter-broker, CONTROLLER quorum) are
            # PLAINTEXT and map to ANONYMOUS — the broker itself must be super
            # user or KRaft breaks. Dev-grade tradeoff: anything reaching the
            # controller port unauthenticated would also be ANONYMOUS.
            - name: KAFKA_SUPER_USERS
              value: "User:ANONYMOUS"
            # Derive the Kafka principal from the token's azp claim (the
            # Keycloak client id) instead of the opaque sub UUID, so ACLs read
            # as User:svc-admin / User:svc-dynamo.
            - name: KAFKA_SASL_OAUTHBEARER_SUB_CLAIM_NAME
              value: "azp"
            # TLS server material for the EXTERNAL (SASL_SSL) listener. PEM keystore
            # (cert chain + key) is assembled by the init container below. No
            # truststore: server-side TLS only; client auth is via OAUTHBEARER.
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: "PEM"
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: "/etc/kafka-tls/keystore.pem"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data/kraft-combined-logs
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_HEAP_OPTS
              value: "-Xms256m -Xmx512m"
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "640Mi"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
            - name: kafka-tls
              mountPath: /etc/kafka-tls
              readOnly: true
      volumes:
        - name: kafka-data
          persistentVolumeClaim:
            claimName: kafka-data
        - name: dnavio-tls
          secret:
            secretName: {{ .Values.tls.secretName }}
        - name: kafka-tls
          emptyDir: {}
