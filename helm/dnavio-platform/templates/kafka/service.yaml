apiVersion: v1
kind: Service
metadata:
  # Fixed name so dependent services can always reach Kafka at kafka:9092.
  name: kafka
  labels:
    {{- include "dnavio-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  type: ClusterIP
  ports:
    # INTERNAL listener — SASL/OAUTHBEARER, in-cluster clients (kafka:9092).
    - name: internal
      port: 9092
      targetPort: 9092
      protocol: TCP
  selector:
    {{- include "dnavio-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
