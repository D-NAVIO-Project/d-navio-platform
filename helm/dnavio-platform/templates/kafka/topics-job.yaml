apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-init
  labels:
    {{- include "dnavio-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
  annotations:
    # Runs after every install and upgrade; safe because --if-not-exists is idempotent.
    # Weight 10 > keycloak-realm-bootstrap (5) so the dnavio-api client exists
    # before this Job authenticates to the broker.
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        {{- include "dnavio-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: kafka-topics-init
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-kafka
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          env:
            - name: DNAVIO_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-secrets
                  key: dnavio-api-secret
          command:
            - /bin/bash
            - -c
            - |
              cat > /tmp/client.properties <<EOF
              security.protocol=SASL_PLAINTEXT
              sasl.mechanism=OAUTHBEARER
              sasl.login.callback.handler.class=org.apache.kafka.common.security.oauthbearer.secured.OAuthBearerLoginCallbackHandler
              sasl.oauthbearer.token.endpoint.url=http://keycloak:8080/realms/{{ .Values.keycloak.realm }}/protocol/openid-connect/token
              sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required clientId="{{ .Values.keycloak.clients.dnavioApi.clientId }}" clientSecret="${DNAVIO_API_SECRET}" ;
              EOF
              until kafka-topics --bootstrap-server kafka:9092 \
                    --command-config /tmp/client.properties --list > /dev/null 2>&1; do
                echo "Waiting for Kafka broker (authenticated)..."
                sleep 5
              done
              echo "Kafka broker is ready and accepting authenticated requests."
      containers:
        - name: create-topics
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          env:
            - name: DNAVIO_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-secrets
                  key: dnavio-api-secret
          command:
            - /bin/bash
            - -c
            - |
              cat > /tmp/client.properties <<EOF
              security.protocol=SASL_PLAINTEXT
              sasl.mechanism=OAUTHBEARER
              sasl.login.callback.handler.class=org.apache.kafka.common.security.oauthbearer.secured.OAuthBearerLoginCallbackHandler
              sasl.oauthbearer.token.endpoint.url=http://keycloak:8080/realms/{{ .Values.keycloak.realm }}/protocol/openid-connect/token
              sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required clientId="{{ .Values.keycloak.clients.dnavioApi.clientId }}" clientSecret="${DNAVIO_API_SECRET}" ;
              EOF
              {{- range .Values.kafka.topics }}
              kafka-topics --bootstrap-server kafka:9092 \
                --command-config /tmp/client.properties \
                --create --topic {{ .name }} \
                --partitions {{ .partitions }} \
                --replication-factor {{ .replicationFactor }} \
                --if-not-exists
              {{- end }}
              echo "All D-NAVIO topics created."
