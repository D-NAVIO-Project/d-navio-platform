{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  # Fixed name: components reach the relational store at postgres:5432.
  name: postgres
  labels:
    {{- include "dnavio-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    {{- include "dnavio-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
{{- end }}
