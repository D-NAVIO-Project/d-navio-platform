apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    {{- include "dnavio-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "dnavio-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "dnavio-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
      annotations:
        # Restart the gateway, and only the gateway, when its rules change.
        checksum/config: {{ include (print $.Template.BasePath "/gateway/configmap.yaml") . | sha256sum }}
    spec:
      enableServiceLinks: false
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          ports:
            - name: https
              containerPort: 9443
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "48Mi"
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: dnavio-tls
              mountPath: /etc/dnavio-tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: gateway
        - name: dnavio-tls
          secret:
            secretName: {{ .Values.tls.secretName }}
