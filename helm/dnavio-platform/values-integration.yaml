# Integration / test environment overrides.
kafka:
  topics:
    - name: dnavio.telemetry.raw
      partitions: 2
      replicationFactor: 1
    - name: dnavio.telemetry.processed
      partitions: 2
      replicationFactor: 1
    - name: dnavio.alerts
      partitions: 1
      replicationFactor: 1
    - name: dnavio.failures
      partitions: 1
      replicationFactor: 1
    - name: dnavio.risk
      partitions: 1
      replicationFactor: 1
