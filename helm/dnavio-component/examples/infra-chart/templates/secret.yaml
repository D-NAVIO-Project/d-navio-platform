{{- $partner := include "infra.partner" . }}
{{- $password := include "infra.password" . }}
apiVersion: v1
kind: Secret
metadata:
  # <partner>-secrets: your services read it through the `partner` alias,
  # e.g. secretEnv: { DATABASE_URL: partner/postgres-dsn }
  name: {{ $partner }}-secrets
  annotations:
    # Survives `helm uninstall`, so the password always matches the data volume.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  postgres-password: {{ $password | quote }}
  postgres-dsn: {{ printf "postgres://%s:%s@%s-postgres:5432/%s?sslmode=disable" .Values.postgres.username ($password | urlquery) $partner .Values.postgres.database | quote }}
